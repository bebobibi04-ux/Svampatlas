<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="810" viewBox="0 0 1120 810" role="img"><title>Basidiesvamp: cellinnehåll och kärnor förenas i olika steg</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2d614a"/></marker></defs>
<rect width="1120" height="810" rx="24" fill="#f2f7f4"/>
<g font-family="Arial,sans-serif" fill="#153f32">
<text x="30" y="47" font-size="28" font-weight="bold">Basidiesvamp: cellinnehåll och kärnor förenas i olika steg</text>
<rect x="40" y="100" width="480" height="115" rx="16" fill="#e2f0e5" stroke="#9abfa5" stroke-width="2"/>
<text x="58" y="132" font-size="22" font-weight="bold">1. Basidiespor gror · n</text>
<text x="58" y="162" font-size="19">En haploid spor börjar växa.</text>
<path d="M520 157 L590 157" stroke="#2d614a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="590" y="100" width="480" height="115" rx="16" fill="#e2f0e5" stroke="#9abfa5" stroke-width="2"/>
<text x="608" y="132" font-size="22" font-weight="bold">2. Primärt mycel · n</text>
<text x="608" y="162" font-size="19">Hyfer med haploida kärnor bildar ett nätverk.</text>
<path d="M830 215 L830 260" stroke="#2d614a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="590" y="260" width="480" height="115" rx="16" fill="#e2f0e5" stroke="#9abfa5" stroke-width="2"/>
<text x="608" y="292" font-size="22" font-weight="bold">3. Plasmogami · n + n</text>
<text x="608" y="322" font-size="19">Kompatibla mycels cellinnehåll förenas.</text>
<text x="608" y="345" font-size="19">Kärnorna hålls fortfarande åtskilda.</text>
<path d="M590 317 L520 317" stroke="#2d614a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="260" width="480" height="115" rx="16" fill="#e2f0e5" stroke="#9abfa5" stroke-width="2"/>
<text x="58" y="292" font-size="22" font-weight="bold">4. Sekundärt mycel · n + n</text>
<text x="58" y="322" font-size="19">Två separata haploida kärnor per typisk cell.</text>
<text x="58" y="345" font-size="19">Detta är inte en diploid kärna.</text>
<path d="M280 375 L280 420" stroke="#2d614a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="420" width="480" height="115" rx="16" fill="#e2f0e5" stroke="#9abfa5" stroke-width="2"/>
<text x="58" y="452" font-size="22" font-weight="bold">5. Fruktkropp och basidier · n + n</text>
<text x="58" y="482" font-size="19">Mycelet kan bilda anlag, ung och mogen kropp.</text>
<path d="M520 477 L590 477" stroke="#2d614a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="590" y="420" width="480" height="115" rx="16" fill="#fff2dc" stroke="#9abfa5" stroke-width="2"/>
<text x="608" y="452" font-size="22" font-weight="bold">6. Kärnsammanslagning i basidiet · 2n</text>
<text x="608" y="482" font-size="19">Kärnorna förenas till en diploid kärna.</text>
<path d="M830 535 L830 580" stroke="#2d614a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="590" y="580" width="480" height="115" rx="16" fill="#e2f0e5" stroke="#9abfa5" stroke-width="2"/>
<text x="608" y="612" font-size="22" font-weight="bold">7. Meios i basidiet · 2n → n</text>
<text x="608" y="642" font-size="19">Den avbildade kärnövergången följs av meios.</text>
<text x="608" y="665" font-size="19">Fyra haploida kärnor i det visade exemplet.</text>
<path d="M590 637 L520 637" stroke="#2d614a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="580" width="480" height="115" rx="16" fill="#e2f0e5" stroke="#9abfa5" stroke-width="2"/>
<text x="58" y="612" font-size="22" font-weight="bold">8. Utvändiga basidiesporer · n</text>
<text x="58" y="642" font-size="19">Sporer på basidiets utskott släpps och sprids.</text>
<path d="M40 637 H17 V157 H40" stroke="#2d614a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="35" y="743" font-size="17">Egen studiefigur efter sida 39: primärt/sekundärt mycel, plasmogami, kärnfusion och meios.</text>
<text x="35" y="772" font-size="17">Åter till nya sporer. Förklaring och villkor finns i teoriavsnittets stegverktyg.</text>
</g></svg>